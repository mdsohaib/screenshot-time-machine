# Publishes to npm via trusted publishing (OIDC) when a v* tag is pushed.
# No NPM_TOKEN anywhere. Local ritual: move Unreleased into a versioned CHANGELOG
# section, then `npm version <bump>` and `git push --follow-tags`.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm test
  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # OIDC for npm trusted publishing + provenance, nothing else
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24 # bundles npm 11, required for trusted publishing
          registry-url: https://registry.npmjs.org
      - name: Tag must match package.json version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - name: Publish, unless this version is already on npm
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          if npm view "screenshot-time-machine@$VERSION" version > /dev/null 2>&1; then
            echo "screenshot-time-machine@$VERSION is already published, nothing to do."
          else
            npm publish
          fi
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # gh release create
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: GitHub release from the top versioned CHANGELOG section
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          node -e '
            // Take the first "## [x.y.z]" section, skipping "## [Unreleased]".
            // Splitting beats a regex here: a multiline $ terminator matches the
            // end of the first line and silently truncates the notes.
            const md = require("fs").readFileSync("CHANGELOG.md", "utf8");
            const section = md.split(/^## /m).find((s) => /^\[(?!Unreleased)/.test(s));
            const notes = section ? section.split("\n").slice(1).join("\n").trim() : "";
            require("fs").writeFileSync("/tmp/notes.md", notes || "See CHANGELOG.md");
          '
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file /tmp/notes.md
