name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 22 }
          - { os: ubuntu-latest, node: 24 }
          - { os: macos-latest, node: 24 }
          - { os: windows-latest, node: 24 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '${{ matrix.node }}', cache: npm }
      - run: npm ci
      # GitHub runners ship Google Chrome, so no browser download happens here.
      - run: npm test
      - run: npm run check
      - run: npm run lint
      - name: The published tarball contains exactly what we expect
        run: npm pack --dry-run 2>&1 | tee pack.txt && grep -q "skills/stm/SKILL.md" pack.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: failed-${{ matrix.os }}-${{ matrix.node }}
          path: |
            /tmp/stm-*/**/*.png
            ${{ runner.temp }}/stm-*/**/*.png
          if-no-files-found: ignore

  fresh-machine:
    # No Chrome, no cached browser: proves the one-time headless-shell download path
    # and that stdout stays clean while it happens.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: npm }
      - run: sudo apt-get remove -y google-chrome-stable microsoft-edge-stable || true
      - run: rm -rf ~/.cache/ms-playwright
      - run: npm ci
      - run: npm test
